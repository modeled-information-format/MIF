---
name: Validate MIF Bundles and Schemas

"on":
  push:
    branches: [main]
    paths:
      - 'schema/**'
      - 'examples/**'
      - 'profiles/**'
      - 'scripts/*.py'
      - 'test/**'
      - 'docs/**'
      - 'src/content/docs/**'
      - 'adr/**'
      - 'package.json'
      - 'astro.config.mjs'
    # No path filter on PRs: this is a required branch-protection gate, so it
    # must run on every PR (a path-filtered required check that doesn't run
    # would block merges indefinitely).
  pull_request:
    branches: [main, "release/**", "develop/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  okf-conformance:
    name: OKF Conformance + Lossless Round-Trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements-ci.txt

      - name: Install JSON-LD fidelity test dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements-jsonld-ci.txt

      - name: OKF conformance test (relationship sync + round-trip)
        run: |
          python scripts/okf_validate.py \
            examples \
            profiles/ai-memory/examples \
            docs/examples/memories

      - name: Lossless markdown -> json-ld -> markdown round-trip
        run: |
          python scripts/mif_convert.py roundtrip \
            examples \
            profiles/ai-memory/examples \
            docs/examples/memories

      - name: JSON-LD context fidelity (real JSON-LD 1.1 expand/compact)
        run: python scripts/test_jsonld_context_fidelity.py

      - name: Vocab term coverage (every @type:@vocab enum value is registered)
        run: python scripts/check_vocab_term_coverage.py

      - name: Relationship-type vocab coverage (context.jsonld terms are registered in vocabulary.jsonld)
        run: python scripts/check_relationship_type_vocab_coverage.py

      - name: Custom relationship_types registry (.mif/config.yaml)
        run: python scripts/test_relationship_types_config.py

      - name: Temporal consistency + properties construct regression suite
        run: python -m pytest scripts/test_temporal_and_properties.py -q

  schema-validation:
    name: Validate JSON-LD Projection Against Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements-ci.txt

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install pinned dependencies (ajv-cli via lockfile)
        run: npm ci

      - name: Emit derived JSON-LD projections
        run: |
          python scripts/mif_convert.py emit-jsonld \
            examples profiles/ai-memory/examples docs/examples/memories \
            --out-dir dist/jsonld

      - name: Validate every projection against schema/mif.schema.json
        run: |
          # ajv-cli detects the parser by file extension and does not recognize
          # .jsonld, so validate .json copies of the derived projections.
          find dist/jsonld -name '*.jsonld' -print0 | while IFS= read -r -d '' f; do
            json="${f%.jsonld}.json"
            cp "$f" "$json"
            echo "Validating $json"
            npx --no-install ajv validate -s schema/mif.schema.json \
              -r "schema/definitions/*.schema.json" \
              -d "$json" --spec=draft2020 -c ajv-formats
          done

  container-validation:
    # Validates *.corpus.json Container Profile artifacts (ADR-021).
    # scripts/mif_convert.py's iter_concepts() only discovers *.md files, so
    # a *.corpus.json envelope is invisible to okf-conformance/schema-validation
    # above by construction -- this job is the dedicated validation path
    # ADR-021 Decision point 9 requires. No path filter on pull_request, same
    # rationale as the other required jobs in this workflow.
    name: Validate Container Profile Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-jsonld-ci.txt

      - name: Install dependencies (hash-pinned)
        # requirements-ci.txt provides pyyaml: test_container_context_fidelity.py
        # imports mif_convert (for CONTEXT_URL), which needs it.
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install --require-hashes -r requirements-jsonld-ci.txt

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies (ajv-cli via lockfile)
        run: npm ci

      - name: Validate Container Profile examples
        # examples/, docs/, and profiles/ rather than just examples/container,
        # so a *.corpus.json sample added anywhere plausible is gated too --
        # not repo root, which would sweep node_modules.
        run: python scripts/validate_container.py examples docs profiles

      - name: ajv batching regression (issue #260 -- one spawn per kind, not per record)
        run: python scripts/test_ajv_batch.py

      - name: container-context.jsonld fidelity (real JSON-LD 1.1 expand/compact, issue #257)
        run: python scripts/test_container_context_fidelity.py

      - name: container-context.jsonld / context.jsonld shared-term drift check (issue #259)
        run: python scripts/check_container_context_drift.py

  docs-build:
    name: Build Docs Site (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify generated llms.txt preserves the product name
        run: |
          grep -q "Modeled Information Format" dist/llms-full.txt
          grep -q "Modeled Information Format" dist/llms-small.txt

  validate-ontologies:
    # Ontology CONTENT (validate-ontologies.py / validate-namespaces.py's
    # corpus-scanning role) moved to the modeled-information-format/ontologies
    # repo per ADR-018/ADR-019 -- this repo has nothing local for those checks
    # to run against (see scripts/vendor-ontologies.py's docstring and
    # ADR-019's audit trail). test_subtype_of.py stays: it exercises the
    # subtype_of/subsumption resolver in validate-ontologies.py against
    # hardcoded fixtures, not this repo's (nonexistent) corpus, so it's
    # unaffected and still a meaningful regression test for that logic.
    #
    # Job `name:` below is NOT cosmetic -- "Validate Ontology Files" is a
    # required branch-protection status check on main. Renaming it would
    # make that required check permanently unsatisfiable and silently block
    # every future PR. Keep the name exactly as-is even though the job's
    # actual content narrowed.
    name: Validate Ontology Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements-ci.txt

      - name: Test subtype_of integrity
        run: python scripts/test_subtype_of.py

  adr-audit-citation-lint:
    # Diff-scoped guardrail against the #241 bug class: flags a NEWLY ADDED
    # raw L\d+ line-number citation in an adr/*.md Audit table (#238's
    # durable-anchor convention, documented in adr/README.md). Deliberately
    # does not check the 11 ADRs #241 catalogued as already using raw line
    # numbers -- retrofitting those is separate, tracked work (#241), not
    # something this check demands overnight.
    name: ADR Audit Citation Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history, not the default shallow depth-1: the diff below needs
          # a resolvable merge-base against an arbitrary-distance PR base branch
          # (`git diff base...head`), which a shallow clone can't guarantee.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Check for newly-added raw line-number citations
        env:
          EVENT_NAME: ${{ github.event_name }}
          # The PR base SHA, not a branch name: actions/checkout with
          # fetch-depth: 0 fetches the history needed to reach this exact
          # commit, but does not reliably create an `origin/<branch>`
          # remote-tracking ref for it -- diffing against the SHA directly
          # sidesteps that ref-resolution question entirely.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$NULL_SHA" ]; then
            BASE="$BEFORE_SHA"
          else
            # workflow_dispatch, or a push with no resolvable prior state (a
            # brand-new branch's first push has BEFORE_SHA=$NULL_SHA): there is
            # no single prior commit to diff against. Compare against
            # origin/main instead of silently producing an empty (and falsely
            # "clean") base...head range.
            echo "No PR base or resolvable prior push state (event=$EVENT_NAME) -- comparing against origin/main instead."
            BASE="origin/main"
          fi
          python scripts/check_adr_audit_citations.py --base "$BASE" --head HEAD
