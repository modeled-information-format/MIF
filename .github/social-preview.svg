<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MIF — the Modeled Information Format specification. The canonical schema every conformant tool implements against: one document, read losslessly as human Markdown and machine JSON-LD.">
  <title>MIF — the specification, the keystone of the org</title>
  <desc>Dark field. The chevron-M MIF mark and wordmark. Title "The Specification". Three pillars — canonical schema, two readers one document, fail-closed conformance — beside the one-artifact-two-readers motif: a single source document fans out to a human-readable Markdown panel (amber) and a machine-parseable JSON-LD panel (cyan), joined by a lossless round-trip and a mif-validate conformance badge.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0D13"/>
      <stop offset="1" stop-color="#0E121B"/>
    </linearGradient>
    <linearGradient id="mif-spine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#E8EEF6" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C8AA0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Field -->
  <rect width="1280" height="640" fill="url(#field)"/>
  <rect x="36" y="36" width="1208" height="568" rx="20" fill="none" stroke="#222C3C" stroke-width="2"/>

  <!-- ===== Identity lockup (top-left): chevron-M mark + wordmark ===== -->
  <g transform="translate(84 66) scale(1.15)" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6 42 L6 6 L24 29" stroke="#34D3E8"/>
    <path d="M24 29 L42 6 L42 42" stroke="#F5B642"/>
    <path d="M24 25.6 L27.4 29 L24 32.4 L20.6 29 Z" fill="#E8EEF6" stroke="none"/>
  </g>
  <text x="150" y="112" font-family="Menlo, 'SF Mono', 'JetBrains Mono', monospace"
        font-size="30" font-weight="700" letter-spacing="0.04em" fill="#E8EEF6">MIF</text>
  <text x="222" y="112" font-family="Menlo, 'SF Mono', 'JetBrains Mono', monospace"
        font-size="15" fill="#7C8AA0" letter-spacing="0.05em">Modeled Information Format</text>

  <!-- ===== Title block (left column) ===== -->
  <text x="84" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-0.02em" fill="#E8EEF6">The Specification</text>
  <text x="86" y="254" font-family="Menlo, 'SF Mono', 'JetBrains Mono', monospace"
        font-size="17" fill="#AEBCCF" letter-spacing="0.01em">The schema every conformant tool implements against.</text>

  <!-- ===== Three pillars ===== -->
  <!-- 1 · Canonical schema (machine-cyan square = the structure a parser validates) -->
  <rect x="86" y="316" width="16" height="16" rx="2" fill="#34D3E8"/>
  <text x="122" y="324" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" fill="#E8EEF6">Canonical schema</text>
  <text x="122" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" fill="#7C8AA0">mif.schema.json — one resolvable $id every implementation targets.</text>

  <!-- 2 · Two readers, one document (light vertex node = the single artifact both converge on) -->
  <path d="M94 398 L100.4 404.4 L94 410.8 L87.6 404.4 Z" fill="#E8EEF6"/>
  <text x="122" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" fill="#E8EEF6">Two readers, one document</text>
  <text x="122" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" fill="#7C8AA0">Markdown a person reads; JSON-LD a parser resolves — losslessly.</text>

  <!-- 3 · Fail-closed conformance (human-amber dot = the meaning proven to survive) -->
  <circle cx="94" cy="488" r="9" fill="#F5B642"/>
  <text x="122" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" fill="#E8EEF6">Fail-closed conformance</text>
  <text x="122" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" fill="#7C8AA0">mif-validate proves the round-trip before a bundle ships.</text>

  <!-- ===== One-artifact-two-readers motif (right column), reused at scale from the doc-suite's own hero ===== -->
  <g transform="translate(671.2 60.56) scale(0.96)">
    <text x="280" y="114" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="0.1em" fill="#7C8AA0">ONE ARTIFACT, TWO READERS</text>
    <rect x="206" y="124" width="148" height="30" rx="7" fill="#151B27" stroke="#2E3A4D"/>
    <text x="280" y="143" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#AEBCCF">--- frontmatter ---</text>
    <path d="M280 154 L280 188" stroke="url(#mif-spine)" stroke-width="2"/>
    <path d="M280 188 C 280 206, 145 196, 145 214 M280 188 C 280 206, 415 196, 415 214" stroke="#3C4B63" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g>
      <rect x="34" y="214" width="222" height="150" rx="12" fill="#0E121B" stroke="#2E3A4D"/>
      <path d="M34 226 a12 12 0 0 1 12 -12 h198 a12 12 0 0 1 12 12 v10 h-222 z" fill="#2A2110"/>
      <circle cx="52" cy="231" r="5" fill="#F5B642"/>
      <text x="66" y="235" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#F5B642">human-readable</text>
      <text x="48" y="272" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E8EEF6"># A decision, in prose</text>
      <rect x="48" y="285" width="180" height="7" rx="3.5" fill="#3C4B63"/>
      <rect x="48" y="299" width="194" height="7" rx="3.5" fill="#2E3A4D"/>
      <rect x="48" y="313" width="150" height="7" rx="3.5" fill="#2E3A4D"/>
      <text x="48" y="346" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="0.04em" fill="#7C8AA0">Markdown · a person reads</text>
    </g>
    <g>
      <rect x="304" y="214" width="222" height="150" rx="12" fill="#0E121B" stroke="#2E3A4D"/>
      <path d="M304 226 a12 12 0 0 1 12 -12 h198 a12 12 0 0 1 12 12 v10 h-222 z" fill="#0A2630"/>
      <circle cx="322" cy="231" r="5" fill="#34D3E8"/>
      <text x="336" y="235" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#34D3E8">machine-parseable</text>
      <text x="318" y="270" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#7C8AA0">{</text>
      <text x="332" y="288" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#34D3E8">"@type"</tspan><tspan fill="#7C8AA0">: </tspan><tspan fill="#F5B642">"Decision"</tspan><tspan fill="#7C8AA0">,</tspan></text>
      <text x="332" y="306" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#34D3E8">"entity"</tspan><tspan fill="#7C8AA0">: </tspan><tspan fill="#AEBCCF">{ … }</tspan></text>
      <text x="318" y="324" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#7C8AA0">}</text>
      <text x="318" y="346" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="0.04em" fill="#7C8AA0">JSON-LD · a parser resolves</text>
    </g>
    <path d="M256 300 L304 300" stroke="#7C8AA0" stroke-width="1.5"/>
    <path d="M268 294 L256 300 L268 306" stroke="#F5B642" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M292 294 L304 300 L292 306" stroke="#34D3E8" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="98" y="386" width="364" height="30" rx="15" fill="#0B2618" stroke="#34C77B" stroke-opacity="0.5"/>
    <circle cx="116" cy="401" r="4.5" fill="#34C77B"/>
    <text x="132" y="405" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" letter-spacing="0.02em" xml:space="preserve"><tspan fill="#34C77B">mif-validate</tspan><tspan fill="#AEBCCF"> · lossless round-trip · L1→L3</tspan></text>
  </g>

  <!-- ===== Footer locators ===== -->
  <text x="84" y="572" font-family="Menlo, 'SF Mono', 'JetBrains Mono', monospace"
        font-size="15" fill="#7C8AA0" letter-spacing="0.01em">modeled-information-format/MIF</text>
  <text x="1192" y="572" text-anchor="end" font-family="Menlo, 'SF Mono', 'JetBrains Mono', monospace"
        font-size="15" fill="#7C8AA0" letter-spacing="0.02em">mif-spec.dev</text>
</svg>
